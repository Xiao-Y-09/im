# 显式项目名：本机另有项目也放在名为 deploy 的目录里，默认项目名会和它冲突，
# 导致 compose down / ps 误伤对方的容器。
name: im

services:
  mysql:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: im }
    ports: ["3306:3306"]
  redis:
    image: redis:7
    # 本机 6379 已被其他项目的 redis 占用，映射到 6380（config.yaml 的 redis_addr 同步修改）
    ports: ["6380:6379"]
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports: ["9092:9092"]
    # 默认配置对外通告 localhost:9092，Windows 上会走 ::1 → Docker IPv6 转发，每次往返约 40ms。
    # 改为通告 127.0.0.1；镜像要求一旦覆盖就给出完整的 KRaft 单节点配置。
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
